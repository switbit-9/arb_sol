[package]
name = "solana_arbitrage"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_arbitrage"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = []
anchor-debug = []
custom-heap = []
custom-panic = []
debug = []

[dependencies]
# Zero-overhead on-chain framework
pinocchio = { version = "0.7", features = ["std"] }
# Compile-time base58 pubkey decoding (used by pinocchio internally, exposed here for const Pubkeys)
five8_const = "0.1"
# SPL Token-2022 for transfer fee extension parsing (no-entrypoint avoids duplicate entrypoint)
spl-token-2022 = { version = "6", features = ["no-entrypoint"] }

num_enum = "0.7"
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }
static_assertions = "1.1.0"
ruint = "1.3.0"
uint = "0.9"
num-integer = "0.1.45"
num-traits = "0.2.19"
anyhow = "1.0.71"

[dev-dependencies]
# Kept for test infrastructure only — production code uses pinocchio types.
# Tests that call start_bot directly need migration to LiteSVM/Mollusk.
# See: https://github.com/anza-xyz/mollusk or https://github.com/litesvm/litesvm
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
anchor-client = "0.32.1"
solana-client = "2.3.13"
solana-sdk = "2.3.0"
solana-account = "3.0.0"
tokio = { version = "1.0", features = ["full"] }
proptest = "1.5.1"
spl-math = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
