[package]
name = "solana_arbitrage"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_arbitrage"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []
debug = []
benchmark = ["solana-msg"]


[dependencies]
# Pinocchio (zero-copy Solana framework) — target
pinocchio = "0.10"
pinocchio-pubkey = "0.3"
pinocchio-log = "0.5"
pinocchio-token = "0.5"

# SPL (direct deps, replacing anchor-spl re-exports)
solana-program = "=2.3.0"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "=8.0.1", features = ["no-entrypoint"] }

num_enum = "0.7"
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }
static_assertions = "1.1.0"
ruint = "1.3.0"
uint = "0.9"
num-integer = "0.1.45"
num-traits = "0.2.19"
anyhow = "1.0.71"
solana-msg = { version = "2", optional = true }

[dev-dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
solana-client = "=2.3.1"
solana-sdk = "=2.3.1"
solana-program-test = "=2.3.1"
tokio = { version = "1.0", features = ["full"] }
proptest = "1.5.1"
spl-math = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("benchmark"))',
] }
